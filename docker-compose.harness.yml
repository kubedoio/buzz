# =============================================================================
# Isolated test-relay backing stack — GUI read-model overhaul harness (Dawn).
#
# A SEPARATE Compose project (`buzz-harness`) so the shared :3000 relay and the
# default `buzz-*` dev stack are never touched. No fixed container_names (they
# collide across projects) and alternate host ports. Mirrors Eva's evaperf-*
# isolation pattern.
#
#   Bring up:  docker compose -p buzz-harness -f docker-compose.harness.yml up -d
#   Ports:     postgres 5471 · redis 6471 · RustFS 9471/9472
#   Relay (run separately by scripts/start-isolated-test-relay.sh):
#              main 3030 · health 8088 · metrics 9202
# =============================================================================
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5471:5432"
    volumes:
      - harness-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6471:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ROOT_USER: buzz_dev
      RUSTFS_ROOT_PASSWORD: buzz_dev_secret
      RUSTFS_DATA_DIR: /data
      RUSTFS_LOGS_DIR: /logs
    ports:
      - "9471:9000"
      - "9472:9001"
    volumes:
      - harness-rustfs-data:/data
      - harness-rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9000 && nc -z localhost 9001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs-init:
    image: rustfs/rc@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        rc alias set local http://rustfs:9000 buzz_dev buzz_dev_secret &&
        rc bucket create local/buzz-media --ignore-existing --quiet
      "
    restart: "no"

volumes:
  harness-postgres-data:
  harness-rustfs-data:
  harness-rustfs-logs:
