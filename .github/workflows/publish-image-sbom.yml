name: Publish image SBOM

on:
  workflow_dispatch:
    inputs:
      image:
        description: Fully-qualified GHCR image name
        required: true
        default: ghcr.io/kubedoio/buzz-elembra
        type: string
      digest:
        description: Exact immutable image digest, for example sha256:...
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish SPDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify immutable image digest
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            ghcr.io/*) ;;
            *) echo "image must be a GHCR reference: $IMAGE" >&2; exit 1 ;;
          esac
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          manifest=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" \
            --format '{{json .Manifest}}')
          resolved_digest=$(jq -r '.digest' <<< "$manifest")
          test "$resolved_digest" = "$DIGEST"
          jq -e '
            ([.manifests[]?.platform | select(.os == "linux" and .architecture == "amd64")] | length == 1) and
            ([.manifests[]?.platform | select(.os == "linux" and .architecture == "arm64")] | length == 1)
          ' <<< "$manifest" >/dev/null
          echo "digest=$resolved_digest" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM from the exact digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ inputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.run_id }}
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false
          syft-version: v1.42.3

      - name: Attest SPDX SBOM to the exact image digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.2.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Published SPDX SBOM"
            echo
            echo "**Subject:** `${IMAGE}@${DIGEST}`"
            echo
            echo "Verify the SBOM attestation and exact subject binding:"
            echo '```'
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner kubedoio --predicate-type https://spdx.dev/Document/v2.3 --format json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
